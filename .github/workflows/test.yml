# Install the cask, check that the daemon runs and answers, then remove it.
name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # brew audit --online asks the GitHub API about the download.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Tap this checkout
        run: brew tap samuelcgilbert/trawlr "$GITHUB_WORKSPACE"
      - name: Style and audit
        run: |
          # Homebrew 6 loads code from other taps only once trusted (installing
          # by the full name, as the README does, trusts that one cask).
          if brew commands | grep -qx trust; then brew trust --cask samuelcgilbert/trawlr/trawlr; fi
          brew style samuelcgilbert/trawlr
          brew audit --cask --online samuelcgilbert/trawlr/trawlr
      - name: Install
        run: brew install --cask samuelcgilbert/trawlr/trawlr
      - name: The daemon runs and answers
        run: |
          for _ in $(seq 120); do trawlr --status 2>/dev/null | grep -q ready && break; sleep 2; done
          trawlr --status
          trawlr --limit 3 Trawlr.app
          test -z "$(xattr -p com.apple.quarantine /Applications/Trawlr.app 2>/dev/null)"
      - name: Uninstall
        run: |
          brew uninstall --cask --zap trawlr
          if sudo launchctl print system/io.trawlr.trawlrd >/dev/null 2>&1; then exit 1; fi
          test ! -e /Applications/Trawlr.app
          test ! -e /usr/local/bin/trawlr
          test ! -e "/Library/Application Support/Trawlr"
